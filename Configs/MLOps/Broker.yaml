# EmpyBroker profile for Agentic-MLOps deployments (local TCP, like Configs/Broker.yaml).
#   EmpyBroker --config Configs/MLOps/Broker.yaml
#   EmpyHarness run --config Configs/MLOps/Harness.yaml        (or HarnessLocal.yaml)
#
# The harness runs its workflows as MMQP request/response exchanges, and the broker ends every exchange
# after request_timeout_ms with TIMEOUT (0x8F). The longest exchanges with the defaults of Harness.yaml
# (timeouts: {agent_ms: 30000, hitl_ms: 60000}) are:
#   - an agent proposal (Workflow() request answered when the whole workflow finishes): agent_ms * 3 + 5000
#     = 95000 ms (train, evaluate and load steps of a retraining);
#   - a human-in-the-loop approval (Hitl() request answered by an operator): hitl_ms = 60000 ms.
# request_timeout_ms must cover both, so raise it together with those timeouts. The harness raises its own
# client response deadline to match; operator commands (EmpyHarness intent/deploy/status) use short
# exchanges and follow long workflows through status polling.
address: 127.0.0.1
port: 5600
workers: 1
max_sessions: 1024
max_profiles: 256
max_inflight: 256
max_packet_bytes: 1048576
max_send_bytes: 4194304
max_session_bytes: 4194304
max_retained_bytes: 16777216
max_retained_topics: 4096
max_requests: 256
max_responders: 64
session_expiry_seconds: 300
keepalive_seconds: 30
handshake_timeout_ms: 5000
retry_interval_ms: 500
max_retries: 5
request_timeout_ms: 120000
tls: false
quic: false
require_auth: false
allow_remote_plaintext: false
