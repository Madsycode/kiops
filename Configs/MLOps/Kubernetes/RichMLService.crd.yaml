# CustomResourceDefinition for RichML-Service descriptors (thesis Fig. 23 execution substrate).
# The KubernetesSubstrate renders one RichMLService resource per workload instance next to its
# ConfigMap and Deployment; spec carries the descriptor "specs" verbatim. Install once with
#   kubectl apply -f Configs/MLOps/Kubernetes/RichMLService.crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: richmlservices.mlops.empy.io
spec:
  group: mlops.empy.io
  scope: Namespaced
  names:
    kind: RichMLService
    listKind: RichMLServiceList
    plural: richmlservices
    singular: richmlservice
    shortNames: [rmls]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                observables:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                actionables:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                inference:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                training:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                constraints:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lifecycle:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .metadata.labels.mlops\.empy\.io/service
        - name: Version
          type: string
          jsonPath: .metadata.labels.mlops\.empy\.io/version
        - name: Role
          type: string
          jsonPath: .metadata.labels.app\.kubernetes\.io/component
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
